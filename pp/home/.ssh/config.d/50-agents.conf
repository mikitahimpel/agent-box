# SSH goes through the Proton SSH agent that agent-box runs on every machine
# (~/.ssh/proton-agents.sock). It serves the one key in this machine's Proton Pass vault
# ("Machine <name>"), so no machine keeps a private key on disk and each has its own key.
# Host addresses for pc and pc-win come from agent-box's block in ~/.ssh/config.

Host my-pc-wsl
  HostName 100.91.85.80
  User gimpel

Host *
  IdentityAgent ~/.ssh/proton-agents.sock
