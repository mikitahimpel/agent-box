# Keys from the Proton Pass "Agents" vault, served by the Proton SSH agent that agent-box
# runs on every machine (~/.ssh/proton-agents.sock), so no machine keeps a private key.
# Host addresses for pc and pc-win come from agent-box's block in ~/.ssh/config; this file
# only picks the key.

Host pc pc-win my-pc-wsl github.com
  IdentityFile ~/.ssh/pub/pc.pub
  IdentitiesOnly yes

Host my-pc-wsl
  HostName 100.91.85.80
  User gimpel

Host *
  IdentityAgent ~/.ssh/proton-agents.sock
